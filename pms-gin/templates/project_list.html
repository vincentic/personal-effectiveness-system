{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>项目列表</h3>
  <a href="/projects/new/" class="btn btn-primary">+ 新建项目</a>
</div>

<form class="row g-2 mb-3" method="get" action="/projects/">
  <div class="col-md-4">
    <input type="text" name="q" value="{{.Keyword}}" class="form-control" placeholder="按名称搜索...">
  </div>
  <div class="col-md-3">
    <select name="status" class="form-select">
      <option value="" {{if eq .Status ""}}selected{{end}}>全部状态</option>
      <option value="active" {{if eq .Status "active"}}selected{{end}}>进行中</option>
      <option value="paused" {{if eq .Status "paused"}}selected{{end}}>已暂停</option>
      <option value="done" {{if eq .Status "done"}}selected{{end}}>已完成</option>
    </select>
  </div>
  <div class="col-md-2">
    <button class="btn btn-outline-primary w-100">筛选</button>
  </div>
</form>

<div class="card shadow-sm">
  <table class="table table-hover mb-0 align-middle">
    <thead class="table-light">
      <tr><th>项目名称</th><th>负责人</th><th>状态</th><th>进度</th><th>创建时间</th><th></th></tr>
    </thead>
    <tbody>
      {{range .Projects}}
      <tr>
        <td><a href="/projects/{{.ID}}/">{{.Name}}</a></td>
        <td>{{.OwnerName}}</td>
        <td><span class="badge {{.StatusBadge}}">{{.StatusLabel}}</span></td>
        <td style="min-width:140px">
          <div class="progress" style="height:8px">
            <div class="progress-bar bg-success" style="width:{{.Progress}}%"></div>
          </div>
          <small class="text-muted">{{.DoneTaskCount}}/{{.TaskCount}}</small>
        </td>
        <td><small>{{.CreatedDate}}</small></td>
        <td>
          {{if eq64 .OwnerID $.CurrentUserID}}
          <a href="/projects/{{.ID}}/edit/" class="btn btn-sm btn-outline-secondary">编辑</a>
          <a href="/projects/{{.ID}}/delete/" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('确定删除该项目及其所有任务吗？')">删除</a>
          {{end}}
        </td>
      </tr>
      {{else}}
      <tr><td colspan="6" class="text-center text-muted py-4">暂无项目</td></tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
