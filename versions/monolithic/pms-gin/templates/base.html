{{define "base.html"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - 个人效能系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">📋 个人效能系统</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/view/mobile/?next={{ .Path }}">📱 手机版</a>
      {{if .Authenticated}}
      <a class="nav-link" href="/">工作台</a>
      <a class="nav-link" href="/daily/">每日清单</a>
      <a class="nav-link" href="/weekly/">每周复盘</a>
      <a class="nav-link" href="/monthly/">每月重构</a>
      {{if .IsAdmin}}<a class="nav-link" href="/admin/users/">用户管理</a>{{end}}
      {{end}}
    </div>
    {{if .Authenticated}}
    <div class="navbar-nav">
      <span class="navbar-text me-3">👤 {{.Username}}</span>
      <form method="post" action="/logout" class="d-inline">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <button class="btn btn-outline-light btn-sm">退出</button>
      </form>
    </div>
    {{end}}
  </div>
</nav>

<main class="container">
  {{template "content" .}}
</main>

<footer class="text-center text-muted py-4 mt-5">
  <small>个人效能系统 · Gin + MySQL · 每日 / 每周 / 每月三张清单</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{{end}}
