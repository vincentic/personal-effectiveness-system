{{define "content"}}
<div class="m-card m-login-card">
  <div class="m-card-head m-center">登录</div>
  <div class="m-card-body">
    <form method="post" action="/login">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      {{if .LoginError}}<div class="m-alert m-alert-danger">用户名或密码错误</div>{{end}}
      <div class="m-field">
        <label>用户名</label>
        <input type="text" name="username" value="{{.UsernameValue}}" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="m-field">
        <label>密码</label>
        <input type="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="m-btn m-btn-primary m-btn-block">登 录</button>
    </form>
  </div>
</div>
{{end}}
