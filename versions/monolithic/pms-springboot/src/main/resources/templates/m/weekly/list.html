<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{m/fragments :: head('每周复盘')}"></head>
<body>
<header th:replace="~{m/fragments :: header('每周复盘')}"></header>

<main class="m-content">
  <h3 class="m-page-title">每周复盘清单</h3>
  <p class="m-page-desc">一人一周一条：下周设计 + 5 问复盘 + 4 领域事实 + 任务流清理。</p>
  <a class="m-btn m-btn-primary m-btn-block" style="margin-bottom:14px" th:href="@{/weekly/new/}">+ 填写本周复盘</a>

  <div class="m-card" th:each="w : ${reviews}">
    <div class="m-card-body">
      <p class="m-card-title">
        <a th:href="@{/weekly/{id}/edit/(id=${w.id})}" th:text="|${w.weekStart} ~ ${w.weekEnd}|"></a>
      </p>
      <div class="m-kv" th:if="${w.nextMit1 != null and w.nextMit1 != ''}">
        <span class="m-kv-key">下周 MIT</span>
        <span class="m-kv-val" th:text="${#strings.abbreviate(w.nextMit1, 60)}"></span>
      </div>
      <div class="m-kv"><span class="m-kv-key">领域 / 任务流</span>
        <span class="m-kv-val" th:text="|${#lists.size(w.domains)} 领域 / ${#lists.size(w.flows)} 条|"></span></div>
      <div class="m-kv"><span class="m-kv-key">深度时间</span>
        <span class="m-kv-val" th:text="${#strings.abbreviate(w.deepWorkTime, 40)}"></span></div>
      <div class="m-btn-row" style="margin-top:12px">
        <a class="m-btn m-btn-sm m-btn-outline" th:href="@{/weekly/{id}/edit/(id=${w.id})}">编辑</a>
        <form method="post" th:action="@{/weekly/{id}/delete/(id=${w.id})}"
              onsubmit="return confirm('确定删除该周复盘吗？')">
          <button class="m-btn m-btn-sm m-btn-danger m-btn-block">删除</button>
        </form>
      </div>
    </div>
  </div>

  <div class="m-card" th:if="${#lists.isEmpty(reviews)}">
    <div class="m-empty">暂无每周复盘，<a th:href="@{/weekly/new/}">去填写</a></div>
  </div>

  <div th:replace="~{m/fragments :: footswitch}"></div>
</main>

<nav th:replace="~{m/fragments :: tabs('weekly')}"></nav>
</body>
</html>
