<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{m/fragments :: head('每月重构')}"></head>
<body>
<header th:replace="~{m/fragments :: header('每月重构')}"></header>

<main class="m-content">
  <h3 class="m-page-title">每月重构清单</h3>
  <p class="m-page-desc">一人一月一条：价值检查 + 三项系统改进 + 6 模块健康检查。</p>
  <a class="m-btn m-btn-primary m-btn-block" style="margin-bottom:14px" th:href="@{/monthly/new/}">+ 填写本月重构</a>

  <div class="m-card" th:each="m : ${reviews}">
    <div class="m-card-body">
      <p class="m-card-title">
        <a th:href="@{/monthly/{id}/edit/(id=${m.id})}" th:text="${m.month}"></a>
      </p>
      <div class="m-kv" th:if="${m.topAchievement != null and m.topAchievement != ''}">
        <span class="m-kv-key">本月成果</span>
        <span class="m-kv-val" th:text="${#strings.abbreviate(m.topAchievement, 60)}"></span>
      </div>
      <div class="m-kv"><span class="m-kv-key">值得投入</span>
        <span class="m-kv-val"><span class="m-badge gray" th:text="${m.worthContinue}"></span></span></div>
      <div class="m-kv"><span class="m-kv-key">健康均分</span>
        <span class="m-kv-val"><span class="m-badge"
              th:text="${m.avgScore == null ? '—' : '均分 ' + m.avgScore}"></span></span></div>
      <div class="m-kv"><span class="m-kv-key">下月三项</span>
        <span class="m-kv-val" th:text="|${#strings.abbreviate(m.keepItem, 14)} / ${#strings.abbreviate(m.cutItem, 14)} / ${#strings.abbreviate(m.experimentItem, 14)}|"></span></div>
      <div class="m-btn-row" style="margin-top:12px">
        <a class="m-btn m-btn-sm m-btn-outline" th:href="@{/monthly/{id}/edit/(id=${m.id})}">编辑</a>
        <form method="post" th:action="@{/monthly/{id}/delete/(id=${m.id})}"
              onsubmit="return confirm('确定删除该月重构清单吗？')">
          <button class="m-btn m-btn-sm m-btn-danger m-btn-block">删除</button>
        </form>
      </div>
    </div>
  </div>

  <div class="m-card" th:if="${#lists.isEmpty(reviews)}">
    <div class="m-empty">暂无每月重构，<a th:href="@{/monthly/new/}">去填写</a></div>
  </div>

  <div th:replace="~{m/fragments :: footswitch}"></div>
</main>

<nav th:replace="~{m/fragments :: tabs('monthly')}"></nav>
</body>
</html>
