<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('每月重构 - 个人效能系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">每月重构清单</h3>
    <a th:href="@{/monthly/new/}" class="btn btn-primary">+ 填写本月重构</a>
  </div>
  <p class="text-muted">一人一月一条：价值检查 + 三项系统改进 + 6 模块健康检查。</p>

  <div class="card shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>月份</th><th>本月最重要成果</th><th>是否值得投入</th><th>健康均分</th><th>下月三项改进</th><th style="width:170px"></th></tr>
      </thead>
      <tbody>
        <tr th:each="m : ${reviews}">
          <td><a th:href="@{/monthly/{id}/edit/(id=${m.id})}" th:text="${m.month}"></a></td>
          <td><span th:text="${#strings.abbreviate(m.topAchievement, 36)}"></span></td>
          <td><span class="badge bg-secondary" th:text="${m.worthContinue}"></span></td>
          <td><span class="badge bg-info text-dark"
                    th:text="${m.avgScore == null ? '—' : '均分 ' + m.avgScore}"></span></td>
          <td><small class="text-muted"
                     th:text="|${#strings.abbreviate(m.keepItem, 14)} / ${#strings.abbreviate(m.cutItem, 14)} / ${#strings.abbreviate(m.experimentItem, 14)}|"></small></td>
          <td>
            <a th:href="@{/monthly/{id}/edit/(id=${m.id})}" class="btn btn-sm btn-outline-secondary">编辑</a>
            <form method="post" th:action="@{/monthly/{id}/delete/(id=${m.id})}" class="d-inline"
                  onsubmit="return confirm('确定删除该月重构清单吗？')">
              <button class="btn btn-sm btn-outline-danger">删除</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reviews)}">
          <td colspan="6" class="text-center text-muted py-4">暂无每月重构，<a th:href="@{/monthly/new/}">去填写</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
