<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head(${title} + ' - 个人效能系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <h3 class="mb-3" th:text="${title}"></h3>
  <form method="post" th:action="${action}" th:object="${form}">
    <div class="card shadow-sm mb-4">
      <div class="card-header">本周起始日与下周设计（少而明确）</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">本周起始日（建议周一）</label>
            <input type="date" class="form-control" th:field="*{weekStart}" required>
            <div class="text-danger small" th:errors="*{weekStart}"></div></div>
          <div class="col-md-4"><label class="form-label">下周最重要成果 1</label><input type="text" class="form-control" th:field="*{nextMit1}"></div>
          <div class="col-md-4"><label class="form-label">下周最重要成果 2</label><input type="text" class="form-control" th:field="*{nextMit2}"></div>
          <div class="col-md-4"><label class="form-label">下周最重要成果 3</label><input type="text" class="form-control" th:field="*{nextMit3}"></div>
          <div class="col-md-4"><label class="form-label">要保护的深度时间（日期 / 时段）</label><input type="text" class="form-control" th:field="*{deepWorkTime}"></div>
          <div class="col-md-4"><label class="form-label">If-Then：如果……</label><input type="text" class="form-control" th:field="*{ifCondition}"></div>
          <div class="col-md-4"><label class="form-label">If-Then：那么我就……</label><input type="text" class="form-control" th:field="*{thenAction}"></div>
          <div class="col-12"><label class="form-label">需要提前准备的环境 / 材料</label><textarea class="form-control" rows="2" th:field="*{prepEnvMaterials}"></textarea></div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">本周领域回顾（4 领域，事实与状态）</div>
      <div class="card-body">
        <div class="row g-3" th:each="i : ${#numbers.sequence(0, 3)}">
          <div class="col-md-3">
            <label class="form-label">领域</label>
            <input type="hidden" th:field="*{domains[__${i}__].domain}">
            <select class="form-select" th:id="|domainSel${i}|" disabled>
              <option value="work" th:selected="${form.domains[i].domain == 'work'}">工作 / 项目</option>
              <option value="study" th:selected="${form.domains[i].domain == 'study'}">学习 / 技能</option>
              <option value="body" th:selected="${form.domains[i].domain == 'body'}">身体 / 精力</option>
              <option value="relations" th:selected="${form.domains[i].domain == 'relations'}">关系 / 生活</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label">本周事实 / 产出</label>
            <textarea class="form-control" rows="2" th:field="*{domains[__${i}__].facts}"></textarea></div>
          <div class="col-md-3"><label class="form-label">状态</label>
            <select class="form-select" th:field="*{domains[__${i}__].status}">
              <option value="smooth">顺利</option><option value="blocked">受阻</option><option value="paused">暂停</option>
            </select></div>
        </div>
        <div class="text-danger small" th:errors="*{domains}"></div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">任务流清理（GTD + Kanban，最多 8 条）</div>
      <div class="card-body">
        <div class="row g-2 align-items-end" th:each="i : ${#numbers.sequence(0, 7)}">
          <div class="col-md-1"><label class="form-label">序号</label>
            <input type="text" class="form-control" th:field="*{flows[__${i}__].seq}" readonly></div>
          <div class="col-md-3"><label class="form-label">分栏</label>
            <select class="form-select" th:field="*{flows[__${i}__].bucket}">
              <option value="todo">待办</option><option value="doing">进行中</option>
              <option value="done">已完成</option><option value="remove">删除 / 委托 / 延后</option>
            </select></div>
          <div class="col-md-8"><label class="form-label">内容（留空则不保存）</label>
            <input type="text" class="form-control" th:field="*{flows[__${i}__].content}"></div>
        </div>
        <div class="text-danger small" th:errors="*{flows}"></div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">复盘 5 问</div>
      <div class="card-body">
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qSkilledBlock}" id="q1"><label class="form-check-label" for="q1">哪个组块本周变得更熟练？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qLowValueTime}" id="q2"><label class="form-check-label" for="q2">哪件事耗时很多但价值很低？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qEstimateGap}" id="q3"><label class="form-check-label" for="q3">哪个时间盒估算偏差最大？为什么？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qRestConnection}" id="q4"><label class="form-check-label" for="q4">本周有没有休息、快乐和真实连接？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qNextAdjust}" id="q5"><label class="form-check-label" for="q5">下周要继续、调整、停止什么？</label></div>
      </div>
    </div>

    <div class="d-flex gap-2 mb-4">
      <button type="submit" class="btn btn-primary">保存</button>
      <a th:href="${cancelUrl}" class="btn btn-outline-secondary">取消</a>
    </div>
  </form>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
