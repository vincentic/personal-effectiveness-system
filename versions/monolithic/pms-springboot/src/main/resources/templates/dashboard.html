<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('工作台 - 个人效能系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <h3 class="mb-1">工作台</h3>
  <p class="text-muted mb-4" th:text="|今天 ${today} · 每日执行 / 每周复盘 / 每月重构|"></p>

  <div class="row g-3 mb-4">
    <div class="col-md-3"><div class="card text-bg-primary h-100"><div class="card-body">
      <h6>每日清单</h6><h2 th:text="${dailyCount}">0</h2></div></div></div>
    <div class="col-md-3"><div class="card text-bg-secondary h-100"><div class="card-body">
      <h6>每周复盘</h6><h2 th:text="${weeklyCount}">0</h2></div></div></div>
    <div class="col-md-3"><div class="card text-bg-warning h-100"><div class="card-body">
      <h6>每月重构</h6><h2 th:text="${monthlyCount}">0</h2></div></div></div>
    <div class="col-md-3"><div class="card text-bg-success h-100"><div class="card-body">
      <h6>近 7 日组块 完成/总数</h6><h2 th:text="|${blockDone} / ${blockTotal}|">0 / 0</h2></div></div></div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card shadow-sm h-100"><div class="card-header">今日执行清单</div>
        <div class="card-body" th:if="${todayPlan != null}">
          <h6 class="mb-2" th:text="${todayPlan.planDate}"></h6>
          <p class="small mb-2" th:if="${todayPlan.mit != null and todayPlan.mit != ''}"
             th:text="|MIT：${todayPlan.mit}|"></p>
          <p class="mb-2"><span class="badge bg-info text-dark"
             th:text="|精力 ${todayPlan.energyLevel}|"></span></p>
          <div class="progress" style="height:8px">
            <div class="progress-bar bg-success" th:style="'width:' + ${todayPlan.blockProgress} + '%'"></div>
          </div>
          <small class="text-muted" th:text="|组块 ${todayPlan.blocksDone}/${todayPlan.blocksTotal} · 清单 ${todayPlan.checklistDone}/13|"></small>
          <div class="mt-3"><a class="btn btn-sm btn-outline-primary"
             th:href="@{/daily/{id}/edit/(id=${todayPlan.id})}">编辑</a></div>
        </div>
        <div class="card-body text-muted" th:if="${todayPlan == null}">
          今天还没有清单。<a th:href="@{/daily/new/}">去填写</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm h-100"><div class="card-header">本周复盘</div>
        <div class="card-body" th:if="${weekReview != null}">
          <h6 class="mb-2" th:text="|${weekReview.weekStart} ~ ${weekReview.weekEnd}|"></h6>
          <p class="small mb-2" th:if="${weekReview.nextMit1 != null and weekReview.nextMit1 != ''}"
             th:text="|下周 MIT：${weekReview.nextMit1}|"></p>
          <small class="text-muted" th:text="|领域 ${#lists.size(weekReview.domains)} · 任务流 ${#lists.size(weekReview.flows)}|"></small>
          <div class="mt-3"><a class="btn btn-sm btn-outline-primary"
             th:href="@{/weekly/{id}/edit/(id=${weekReview.id})}">编辑</a></div>
        </div>
        <div class="card-body text-muted" th:if="${weekReview == null}">
          本周还没有复盘。<a th:href="@{/weekly/new/}">去填写</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm h-100"><div class="card-header">本月重构</div>
        <div class="card-body" th:if="${monthReview != null}">
          <h6 class="mb-2" th:text="${monthReview.month}"></h6>
          <p class="small mb-2" th:if="${monthReview.topAchievement != null and monthReview.topAchievement != ''}"
             th:text="|本月成果：${monthReview.topAchievement}|"></p>
          <small class="text-muted" th:if="${monthReview.avgScore == null}">暂无平均分</small>
          <small class="text-muted" th:if="${monthReview.avgScore != null}"
                 th:text="|健康均分 ${monthReview.avgScore} / 5|"></small>
          <div class="mt-3"><a class="btn btn-sm btn-outline-primary"
             th:href="@{/monthly/{id}/edit/(id=${monthReview.id})}">编辑</a></div>
        </div>
        <div class="card-body text-muted" th:if="${monthReview == null}">
          本月还没有重构清单。<a th:href="@{/monthly/new/}">去填写</a>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm h-100"><div class="card-header">最近每日清单</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="p : ${recentDaily}">
            <a th:href="@{/daily/{id}/edit/(id=${p.id})}" th:text="${p.planDate}"></a>
            <span class="badge bg-success" th:text="|${p.blocksDone}/${p.blocksTotal}|"></span>
          </li>
          <li class="list-group-item text-muted" th:if="${#lists.isEmpty(recentDaily)}">暂无记录</li>
        </ul>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm h-100"><div class="card-header">最近每周复盘</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="w : ${recentWeekly}">
            <a th:href="@{/weekly/{id}/edit/(id=${w.id})}" th:text="${w.weekStart}"></a>
            <span class="badge bg-secondary" th:text="|至 ${w.weekEnd}|"></span>
          </li>
          <li class="list-group-item text-muted" th:if="${#lists.isEmpty(recentWeekly)}">暂无记录</li>
        </ul>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm h-100"><div class="card-header">最近每月重构</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="m : ${recentMonthly}">
            <a th:href="@{/monthly/{id}/edit/(id=${m.id})}" th:text="${m.month}"></a>
            <span class="badge bg-info text-dark"
                  th:text="${m.avgScore == null ? '—' : '均分 ' + m.avgScore}"></span>
          </li>
          <li class="list-group-item text-muted" th:if="${#lists.isEmpty(recentMonthly)}">暂无记录</li>
        </ul>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
