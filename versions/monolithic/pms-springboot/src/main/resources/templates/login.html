<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('登录 - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">登录</h4>
          <form method="post" th:action="@{/login}">
            <div class="alert alert-danger py-2" th:if="${loginError}">用户名或密码错误</div>
            <div class="mb-3">
              <label class="form-label">用户名</label>
              <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">密码</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
