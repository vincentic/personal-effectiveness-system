server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 24h

spring:
  application:
    name: pms-springboot
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时执行幂等建表脚本（classpath:schema.sql），与 Gin 版共用同一套表
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
      continue-on-error: false
  thymeleaf:
    cache: false
    encoding: UTF-8
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/
  jackson:
    time-zone: Asia/Shanghai

# 首次启动且 users 表为空时自动创建的管理员账号（生产环境务必覆盖）
pms:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
logging:
  level:
    root: INFO
    com.example.pms: INFO
