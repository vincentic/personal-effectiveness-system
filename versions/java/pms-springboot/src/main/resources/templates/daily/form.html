<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head(${title} + ' - 个人效能系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <h3 class="mb-3" th:text="${title}"></h3>
  <form method="post" th:action="${action}" th:object="${form}">
    <div class="card shadow-sm mb-4">
      <div class="card-header">基本信息</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">日期</label>
            <input type="date" class="form-control" th:field="*{planDate}" required>
            <div class="text-danger small" th:errors="*{planDate}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">睡眠（小时）</label>
            <input type="number" step="0.1" min="0" max="24" class="form-control" th:field="*{sleepHours}">
            <div class="text-danger small" th:errors="*{sleepHours}"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label">精力</label>
            <select class="form-select" th:field="*{energyLevel}">
              <option value="low">低</option>
              <option value="medium">中</option>
              <option value="high">高</option>
            </select>
            <div class="text-danger small" th:errors="*{energyLevel}"></div>
          </div>
          <div class="col-12">
            <label class="form-label">今日最重要的成果（MIT）</label>
            <textarea class="form-control" rows="2" th:field="*{mit}"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">今日组块与时间盒（最多 4 项）</div>
      <div class="card-body">
        <div th:each="i : ${#numbers.sequence(0, 3)}" class="border rounded p-3 mb-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-1"><label class="form-label">序号</label>
              <input type="text" class="form-control" th:field="*{blocks[__${i}__].seq}" readonly></div>
            <div class="col-md-5"><label class="form-label">组块 / 任务</label>
              <input type="text" class="form-control" th:field="*{blocks[__${i}__].blockName}"
                     placeholder="留空则不保存"></div>
            <div class="col-md-3"><label class="form-label">开始</label>
              <input type="time" class="form-control" th:field="*{blocks[__${i}__].timeStart}"></div>
            <div class="col-md-3"><label class="form-label">结束</label>
              <input type="time" class="form-control" th:field="*{blocks[__${i}__].timeEnd}"></div>
            <div class="col-md-4"><label class="form-label">输入</label>
              <input type="text" class="form-control" th:field="*{blocks[__${i}__].inputDesc}"></div>
            <div class="col-md-4"><label class="form-label">关键动作</label>
              <input type="text" class="form-control" th:field="*{blocks[__${i}__].keyAction}"></div>
            <div class="col-md-4"><label class="form-label">可验收输出</label>
              <input type="text" class="form-control" th:field="*{blocks[__${i}__].deliverable}"></div>
            <div class="col-md-12">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" th:field="*{blocks[__${i}__].done}"
                       th:id="|done${i}|">
                <label class="form-check-label" th:for="|done${i}|">已完成</label>
              </div>
            </div>
          </div>
        </div>
        <div class="text-danger small" th:errors="*{planDate}"></div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">执行前后检查 · 生活维护（13 项）</div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-6"><h6 class="small text-muted">启动前</h6>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{preKnowOutput}" id="pre1"><label class="form-check-label" for="pre1">我知道本轮要交付什么</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{preMaterialsReady}" id="pre2"><label class="form-check-label" for="pre2">材料已准备</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{prePhoneHandled}" id="pre3"><label class="form-check-label" for="pre3">手机 / 通知已处理</label></div>
          </div>
          <div class="col-md-6"><h6 class="small text-muted">执行中</h6>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{duringOneBlock}" id="dur1"><label class="form-check-label" for="dur1">一次只做一个组块</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{duringShrinkStep}" id="dur2"><label class="form-check-label" for="dur2">卡住时先缩小下一步</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{duringRecordDistraction}" id="dur3"><label class="form-check-label" for="dur3">必要时记录干扰</label></div>
          </div>
          <div class="col-md-6"><h6 class="small text-muted">结束后</h6>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{postVisibleOutput}" id="post1"><label class="form-check-label" for="post1">有可见产出</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{postRecall}" id="post2"><label class="form-check-label" for="post2">做了主动回忆 / 复述</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{postNextStep}" id="post3"><label class="form-check-label" for="post3">标记下一步</label></div>
          </div>
          <div class="col-md-6"><h6 class="small text-muted">生活维护</h6>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{lifeWaterFood}" id="life1"><label class="form-check-label" for="life1">饮水 / 正常饮食</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{lifeWalkExercise}" id="life2"><label class="form-check-label" for="life2">走路 / 运动</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{lifeCleanTidy}" id="life3"><label class="form-check-label" for="life3">清洁 / 整理</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{lifeSocialOutdoor}" id="life4"><label class="form-check-label" for="life4">真实交流 / 户外</label></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">晚间 5 分钟复盘</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">今天真正完成了什么</label><textarea class="form-control" rows="2" th:field="*{reviewAccomplished}"></textarea></div>
          <div class="col-md-6"><label class="form-label">今天最大的阻力是什么</label><textarea class="form-control" rows="2" th:field="*{reviewResistance}"></textarea></div>
          <div class="col-md-6"><label class="form-label">明天最小的启动动作</label><textarea class="form-control" rows="2" th:field="*{reviewTomorrowStart}"></textarea></div>
          <div class="col-md-6"><label class="form-label">今天值得感谢 / 享受的一件事</label><textarea class="form-control" rows="2" th:field="*{reviewGratitude}"></textarea></div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mb-4">
      <button type="submit" class="btn btn-primary">保存</button>
      <a th:href="${cancelUrl}" class="btn btn-outline-secondary">取消</a>
    </div>
  </form>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
