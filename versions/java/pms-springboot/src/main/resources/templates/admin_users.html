<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('用户管理 - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <h3 class="mb-3">用户管理</h3>
  <div class="alert alert-success py-2" th:if="${msg}" th:text="${msg}"></div>

  <div class="card shadow-sm mb-4">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>用户名</th><th>显示名称</th><th>角色</th><th>创建时间</th></tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.username}"></td>
          <td th:text="${u.displayName}"></td>
          <td><span class="badge" th:classappend="${u.staff ? 'bg-primary' : 'bg-secondary'}"
                    th:text="${u.staff ? '管理员' : '普通用户'}"></span></td>
          <td><small th:text="${u.createdDate}"></small></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header">新增用户</div>
        <div class="card-body">
          <form method="post" th:action="@{/admin/users/}" th:object="${form}">
            <div class="mb-3">
              <label class="form-label">用户名</label>
              <input type="text" class="form-control" th:field="*{username}" required>
              <div class="text-danger small" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">密码（至少 8 位）</label>
              <input type="password" class="form-control" th:field="*{password}" required>
              <div class="text-danger small" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">显示名称</label>
              <input type="text" class="form-control" th:field="*{displayName}">
              <div class="text-danger small" th:errors="*{displayName}"></div>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" id="staff" th:field="*{staff}">
              <label class="form-check-label" for="staff">管理员（可进入用户管理页）</label>
            </div>
            <button type="submit" class="btn btn-primary">创建用户</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
