<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{m/fragments :: head('用户管理')}"></head>
<body>
<header th:replace="~{m/fragments :: header('用户管理')}"></header>

<main class="m-content">
  <h3 class="m-page-title">用户管理</h3>
  <div class="m-alert ok" th:if="${msg}" th:text="${msg}"></div>

  <div class="m-card" th:each="u : ${users}">
    <div class="m-card-body">
      <p class="m-card-title" th:text="${u.username}"></p>
      <div class="m-kv"><span class="m-kv-key">显示名称</span><span class="m-kv-val" th:text="${u.displayName}"></span></div>
      <div class="m-kv"><span class="m-kv-key">角色</span>
        <span class="m-kv-val"><span class="m-badge" th:classappend="${u.staff ? '' : 'gray'}"
              th:text="${u.staff ? '管理员' : '普通用户'}"></span></span></div>
      <div class="m-kv"><span class="m-kv-key">创建时间</span>
        <span class="m-kv-val"><small th:text="${u.createdDate}"></small></span></div>
    </div>
  </div>
  <div class="m-card" th:if="${#lists.isEmpty(users)}">
    <div class="m-empty">暂无用户</div>
  </div>

  <div class="m-card">
    <div class="m-card-head">新增用户</div>
    <div class="m-card-body">
      <form method="post" th:action="@{/admin/users/}" th:object="${form}" class="m-form">
        <div class="m-field">
          <label class="m-label">用户名</label>
          <input type="text" class="m-input" th:field="*{username}" required>
          <div class="m-error" th:errors="*{username}"></div>
        </div>
        <div class="m-field">
          <label class="m-label">密码（至少 8 位）</label>
          <input type="password" class="m-input" th:field="*{password}" required>
          <div class="m-error" th:errors="*{password}"></div>
        </div>
        <div class="m-field">
          <label class="m-label">显示名称</label>
          <input type="text" class="m-input" th:field="*{displayName}">
          <div class="m-error" th:errors="*{displayName}"></div>
        </div>
        <label class="m-check">
          <input type="checkbox" th:field="*{staff}" th:id="|mStaff|">
          <span>管理员（可进入用户管理页）</span>
        </label>
        <div class="m-field" style="margin-top:16px">
          <button type="submit" class="m-btn m-btn-primary m-btn-block">创建用户</button>
        </div>
      </form>
    </div>
  </div>

  <div th:replace="~{m/fragments :: footswitch}"></div>
</main>

<nav th:replace="~{m/fragments :: tabs('admin')}"></nav>
</body>
</html>
