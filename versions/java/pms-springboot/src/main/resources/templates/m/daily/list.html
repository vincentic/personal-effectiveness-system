<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{m/fragments :: head('每日清单')}"></head>
<body>
<header th:replace="~{m/fragments :: header('每日清单')}"></header>

<main class="m-content">
  <h3 class="m-page-title">每日执行清单</h3>
  <p class="m-page-desc">一人一天一条：组块执行 + 执行前后检查 + 生活维护 + 晚间复盘。</p>
  <a class="m-btn m-btn-primary m-btn-block" style="margin-bottom:14px" th:href="@{/daily/new/}">+ 填写今日清单</a>

  <div class="m-card" th:each="p : ${plans}">
    <div class="m-card-body">
      <p class="m-card-title">
        <a th:href="@{/daily/{id}/edit/(id=${p.id})}" th:text="${p.planDate}"></a>
      </p>
      <div class="m-kv"><span class="m-kv-key">精力</span>
        <span class="m-kv-val"><span class="m-badge" th:text="${p.energyLevel}"></span></span></div>
      <div class="m-kv" th:if="${p.mit != null and p.mit != ''}">
        <span class="m-kv-key">今日 MIT</span><span class="m-kv-val" th:text="${#strings.abbreviate(p.mit, 60)}"></span>
      </div>
      <div class="m-kv"><span class="m-kv-key">组块</span>
        <span class="m-kv-val" th:text="|${p.blocksDone}/${p.blocksTotal}|"></span></div>
      <div class="m-progress"><div th:style="'width:' + ${p.blockProgress} + '%'"></div></div>
      <div class="m-kv"><span class="m-kv-key">清单完成</span>
        <span class="m-kv-val" th:text="|${p.checklistDone}/13|"></span></div>
      <div class="m-btn-row" style="margin-top:12px">
        <a class="m-btn m-btn-sm m-btn-outline" th:href="@{/daily/{id}/edit/(id=${p.id})}">编辑</a>
        <form method="post" th:action="@{/daily/{id}/delete/(id=${p.id})}"
              onsubmit="return confirm('确定删除该清单及其时间盒吗？')">
          <button class="m-btn m-btn-sm m-btn-danger m-btn-block">删除</button>
        </form>
      </div>
    </div>
  </div>

  <div class="m-card" th:if="${#lists.isEmpty(plans)}">
    <div class="m-empty">暂无每日清单，<a th:href="@{/daily/new/}">去填写</a></div>
  </div>

  <div th:replace="~{m/fragments :: footswitch}"></div>
</main>

<nav th:replace="~{m/fragments :: tabs('daily')}"></nav>
</body>
</html>
