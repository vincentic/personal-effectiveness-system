<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">个人效能系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/static/css/mobile.css}">
</head>
<body>

<header th:fragment="header(title)" class="m-header">
  <div class="m-header-inner">
    <a class="m-brand" th:href="@{/}">📋 效能</a>
    <span class="m-title" th:text="${title}">个人效能系统</span>
    <a class="m-switch" th:href="@{/view/pc(next=${currentUri})}">🖥 PC 版</a>
  </div>
</header>

<nav th:fragment="tabs(active)" class="m-tabs">
  <div class="m-tabs-inner">
    <a class="m-tab" th:classappend="${active == 'dashboard' ? 'active' : ''}" th:href="@{/}">
      <span class="m-ico">🏠</span><span>工作台</span></a>
    <a class="m-tab" th:classappend="${active == 'daily' ? 'active' : ''}" th:href="@{/daily/}">
      <span class="m-ico">📅</span><span>每日</span></a>
    <a class="m-tab" th:classappend="${active == 'weekly' ? 'active' : ''}" th:href="@{/weekly/}">
      <span class="m-ico">🗓</span><span>每周</span></a>
    <a class="m-tab" th:classappend="${active == 'monthly' ? 'active' : ''}" th:href="@{/monthly/}">
      <span class="m-ico">📆</span><span>每月</span></a>
  </div>
</nav>

<div th:fragment="footswitch" class="m-footswitch">
  <a th:href="@{/view/auto(next=${currentUri})}">↻ 自动模式（按设备识别）</a>
</div>

</body>
</html>
