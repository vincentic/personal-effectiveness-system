<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{m/fragments :: head(${title} + ' - 每日清单')}"></head>
<body>
<header th:replace="~{m/fragments :: header(${title})}"></header>

<main class="m-content">
  <h3 class="m-page-title" th:text="${title}"></h3>
  <form method="post" th:action="${action}" th:object="${form}" class="m-form">

    <div class="m-card">
      <div class="m-card-head">基本信息</div>
      <div class="m-card-body">
        <div class="m-field">
          <label class="m-label">日期</label>
          <input type="date" class="m-input" th:field="*{planDate}" required>
          <div class="m-error" th:errors="*{planDate}"></div>
        </div>
        <div class="m-field">
          <label class="m-label">睡眠（小时）</label>
          <input type="number" step="0.1" min="0" max="24" class="m-input" th:field="*{sleepHours}">
          <div class="m-error" th:errors="*{sleepHours}"></div>
        </div>
        <div class="m-field">
          <label class="m-label">精力</label>
          <select class="m-select" th:field="*{energyLevel}">
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
          </select>
          <div class="m-error" th:errors="*{energyLevel}"></div>
        </div>
        <div class="m-field">
          <label class="m-label">今日最重要的成果（MIT）</label>
          <textarea class="m-textarea" th:field="*{mit}"></textarea>
        </div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-head">今日组块与时间盒（最多 4 项）</div>
      <div class="m-card-body">
        <div class="m-repeat" th:each="i : ${#numbers.sequence(0, 3)}">
          <div class="m-repeat-head">
            <span>组块 <span th:text="${i + 1}"></span></span>
            <span class="m-card-sub">留空则不保存</span>
          </div>
          <input type="hidden" th:field="*{blocks[__${i}__].seq}">
          <div class="m-field">
            <label class="m-label">组块 / 任务</label>
            <input type="text" class="m-input" th:field="*{blocks[__${i}__].blockName}" placeholder="留空则不保存">
          </div>
          <div class="m-grid-2">
            <div class="m-field">
              <label class="m-label">开始</label>
              <input type="time" class="m-input" th:field="*{blocks[__${i}__].timeStart}">
            </div>
            <div class="m-field">
              <label class="m-label">结束</label>
              <input type="time" class="m-input" th:field="*{blocks[__${i}__].timeEnd}">
            </div>
          </div>
          <div class="m-field">
            <label class="m-label">输入</label>
            <input type="text" class="m-input" th:field="*{blocks[__${i}__].inputDesc}">
          </div>
          <div class="m-field">
            <label class="m-label">关键动作</label>
            <input type="text" class="m-input" th:field="*{blocks[__${i}__].keyAction}">
          </div>
          <div class="m-field">
            <label class="m-label">可验收输出</label>
            <input type="text" class="m-input" th:field="*{blocks[__${i}__].deliverable}">
          </div>
          <label class="m-check">
            <input type="checkbox" th:field="*{blocks[__${i}__].done}" th:id="|mDone${i}|">
            <span>已完成</span>
          </label>
        </div>
        <div class="m-error" th:errors="*{planDate}"></div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-head">执行前后检查 · 生活维护（13 项）</div>
      <div class="m-card-body">
        <p class="m-card-sub" style="margin-top:0">启动前</p>
        <label class="m-check"><input type="checkbox" th:field="*{preKnowOutput}" th:id="|mPre1|"><span>我知道本轮要交付什么</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{preMaterialsReady}" th:id="|mPre2|"><span>材料已准备</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{prePhoneHandled}" th:id="|mPre3|"><span>手机 / 通知已处理</span></label>
        <p class="m-card-sub">执行中</p>
        <label class="m-check"><input type="checkbox" th:field="*{duringOneBlock}" th:id="|mDur1|"><span>一次只做一个组块</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{duringShrinkStep}" th:id="|mDur2|"><span>卡住时先缩小下一步</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{duringRecordDistraction}" th:id="|mDur3|"><span>必要时记录干扰</span></label>
        <p class="m-card-sub">结束后</p>
        <label class="m-check"><input type="checkbox" th:field="*{postVisibleOutput}" th:id="|mPost1|"><span>有可见产出</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{postRecall}" th:id="|mPost2|"><span>做了主动回忆 / 复述</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{postNextStep}" th:id="|mPost3|"><span>标记下一步</span></label>
        <p class="m-card-sub">生活维护</p>
        <label class="m-check"><input type="checkbox" th:field="*{lifeWaterFood}" th:id="|mLife1|"><span>饮水 / 正常饮食</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{lifeWalkExercise}" th:id="|mLife2|"><span>走路 / 运动</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{lifeCleanTidy}" th:id="|mLife3|"><span>清洁 / 整理</span></label>
        <label class="m-check"><input type="checkbox" th:field="*{lifeSocialOutdoor}" th:id="|mLife4|"><span>真实交流 / 户外</span></label>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-head">晚间 5 分钟复盘</div>
      <div class="m-card-body">
        <div class="m-field">
          <label class="m-label">今天真正完成了什么</label>
          <textarea class="m-textarea" th:field="*{reviewAccomplished}"></textarea>
        </div>
        <div class="m-field">
          <label class="m-label">今天最大的阻力是什么</label>
          <textarea class="m-textarea" th:field="*{reviewResistance}"></textarea>
        </div>
        <div class="m-field">
          <label class="m-label">明天最小的启动动作</label>
          <textarea class="m-textarea" th:field="*{reviewTomorrowStart}"></textarea>
        </div>
        <div class="m-field">
          <label class="m-label">今天值得感谢 / 享受的一件事</label>
          <textarea class="m-textarea" th:field="*{reviewGratitude}"></textarea>
        </div>
      </div>
    </div>

    <div class="m-submit-bar">
      <div class="m-btn-row">
        <button type="submit" class="m-btn m-btn-primary">保存</button>
        <a th:href="${cancelUrl}" class="m-btn m-btn-outline">取消</a>
      </div>
    </div>
  </form>

  <div th:replace="~{m/fragments :: footswitch}"></div>
</main>

<nav th:replace="~{m/fragments :: tabs('daily')}"></nav>
</body>
</html>
