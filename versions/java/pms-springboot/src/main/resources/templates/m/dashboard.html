<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{m/fragments :: head('工作台')}"></head>
<body>
<header th:replace="~{m/fragments :: header('工作台')}"></header>

<main class="m-content">
  <h3 class="m-page-title">工作台</h3>
  <p class="m-page-desc" th:text="|今天 ${today} · 每日执行 / 每周复盘 / 每月重构|"></p>

  <div class="m-stat-grid">
    <div class="m-stat p"><span>每日清单</span><strong th:text="${dailyCount}">0</strong></div>
    <div class="m-stat s"><span>每周复盘</span><strong th:text="${weeklyCount}">0</strong></div>
    <div class="m-stat w"><span>每月重构</span><strong th:text="${monthlyCount}">0</strong></div>
    <div class="m-stat g"><span>近 7 日组块 完成/总数</span><strong th:text="|${blockDone} / ${blockTotal}|">0 / 0</strong></div>
  </div>

  <div class="m-card" th:if="${todayPlan != null}">
    <div class="m-card-head">今日执行清单</div>
    <div class="m-card-body">
      <p class="m-card-title" th:text="${todayPlan.planDate}"></p>
      <div class="m-kv" th:if="${todayPlan.mit != null and todayPlan.mit != ''}">
        <span class="m-kv-key">今日 MIT</span><span class="m-kv-val" th:text="${todayPlan.mit}"></span>
      </div>
      <div class="m-kv"><span class="m-kv-key">精力</span>
        <span class="m-kv-val"><span class="m-badge" th:text="${todayPlan.energyLevel}"></span></span></div>
      <div class="m-progress"><div th:style="'width:' + ${todayPlan.blockProgress} + '%'"></div></div>
      <p class="m-card-sub" th:text="|组块 ${todayPlan.blocksDone}/${todayPlan.blocksTotal} · 清单 ${todayPlan.checklistDone}/13|"></p>
      <div class="m-btn-row" style="margin-top:12px">
        <a class="m-btn m-btn-sm m-btn-outline" th:href="@{/daily/{id}/edit/(id=${todayPlan.id})}">编辑</a>
        <a class="m-btn m-btn-sm m-btn-primary" th:href="@{/daily/}">每日清单</a>
      </div>
    </div>
  </div>
  <div class="m-card" th:if="${todayPlan == null}">
    <div class="m-card-body">
      <p class="m-card-sub">今天还没有清单。</p>
      <a class="m-btn m-btn-primary m-btn-block" th:href="@{/daily/new/}">去填写今日清单</a>
    </div>
  </div>

  <div class="m-card" th:if="${weekReview != null}">
    <div class="m-card-head">本周复盘</div>
    <div class="m-card-body">
      <p class="m-card-title" th:text="|${weekReview.weekStart} ~ ${weekReview.weekEnd}|"></p>
      <div class="m-kv" th:if="${weekReview.nextMit1 != null and weekReview.nextMit1 != ''}">
        <span class="m-kv-key">下周 MIT</span><span class="m-kv-val" th:text="${weekReview.nextMit1}"></span>
      </div>
      <p class="m-card-sub" th:text="|领域 ${#lists.size(weekReview.domains)} · 任务流 ${#lists.size(weekReview.flows)}|"></p>
      <div class="m-btn-row" style="margin-top:12px">
        <a class="m-btn m-btn-sm m-btn-outline" th:href="@{/weekly/{id}/edit/(id=${weekReview.id})}">编辑</a>
        <a class="m-btn m-btn-sm m-btn-primary" th:href="@{/weekly/}">每周复盘</a>
      </div>
    </div>
  </div>
  <div class="m-card" th:if="${weekReview == null}">
    <div class="m-card-body">
      <p class="m-card-sub">本周还没有复盘。</p>
      <a class="m-btn m-btn-primary m-btn-block" th:href="@{/weekly/new/}">去填写本周复盘</a>
    </div>
  </div>

  <div class="m-card" th:if="${monthReview != null}">
    <div class="m-card-head">本月重构</div>
    <div class="m-card-body">
      <p class="m-card-title" th:text="${monthReview.month}"></p>
      <div class="m-kv" th:if="${monthReview.topAchievement != null and monthReview.topAchievement != ''}">
        <span class="m-kv-key">本月成果</span><span class="m-kv-val" th:text="${monthReview.topAchievement}"></span>
      </div>
      <p class="m-card-sub" th:if="${monthReview.avgScore == null}">暂无平均分</p>
      <p class="m-card-sub" th:if="${monthReview.avgScore != null}"
         th:text="|健康均分 ${monthReview.avgScore} / 5|"></p>
      <div class="m-btn-row" style="margin-top:12px">
        <a class="m-btn m-btn-sm m-btn-outline" th:href="@{/monthly/{id}/edit/(id=${monthReview.id})}">编辑</a>
        <a class="m-btn m-btn-sm m-btn-primary" th:href="@{/monthly/}">每月重构</a>
      </div>
    </div>
  </div>
  <div class="m-card" th:if="${monthReview == null}">
    <div class="m-card-body">
      <p class="m-card-sub">本月还没有重构清单。</p>
      <a class="m-btn m-btn-primary m-btn-block" th:href="@{/monthly/new/}">去填写本月重构</a>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">最近每日清单</div>
    <div class="m-card-body" th:if="${#lists.isEmpty(recentDaily)}"><p class="m-card-sub">暂无记录</p></div>
    <div class="m-card-body" th:each="p : ${recentDaily}">
      <div class="m-kv">
        <a th:href="@{/daily/{id}/edit/(id=${p.id})}" th:text="${p.planDate}"></a>
        <span class="m-badge green" th:text="|${p.blocksDone}/${p.blocksTotal}|"></span>
      </div>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">最近每周复盘</div>
    <div class="m-card-body" th:if="${#lists.isEmpty(recentWeekly)}"><p class="m-card-sub">暂无记录</p></div>
    <div class="m-card-body" th:each="w : ${recentWeekly}">
      <div class="m-kv">
        <a th:href="@{/weekly/{id}/edit/(id=${w.id})}" th:text="${w.weekStart}"></a>
        <span class="m-badge gray" th:text="|至 ${w.weekEnd}|"></span>
      </div>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">最近每月重构</div>
    <div class="m-card-body" th:if="${#lists.isEmpty(recentMonthly)}"><p class="m-card-sub">暂无记录</p></div>
    <div class="m-card-body" th:each="m : ${recentMonthly}">
      <div class="m-kv">
        <a th:href="@{/monthly/{id}/edit/(id=${m.id})}" th:text="${m.month}"></a>
        <span class="m-badge" th:text="${m.avgScore == null ? '—' : '均分 ' + m.avgScore}"></span>
      </div>
    </div>
  </div>

  <div th:replace="~{m/fragments :: footswitch}"></div>
</main>

<nav th:replace="~{m/fragments :: tabs('dashboard')}"></nav>
</body>
</html>
