{% extends "m/base.html" %}
{% block title %}登录 - 个人效能系统{% endblock %}
{% block page_title %}登录{% endblock %}
{% block content %}

<div class="m-login">
  <div class="m-card">
    <div class="m-card-head"><span>登录个人效能系统</span></div>
    <div class="m-card-body">
      <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="m-alert m-alert-danger">用户名或密码错误</div>{% endif %}
        <div class="m-field">
          <label class="m-field-label" for="id_username">用户名</label>
          <input type="text" name="username" id="id_username" class="m-input" required autofocus autocomplete="username">
        </div>
        <div class="m-field">
          <label class="m-field-label" for="id_password">密码</label>
          <input type="password" name="password" id="id_password" class="m-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="m-btn m-btn-primary m-btn-block m-btn-lg">登 录</button>
      </form>
    </div>
  </div>
  <div class="m-login-hint">重要事情持续推进，生活基本盘稳定，注意力有自主权</div>
</div>

{% endblock %}
