{{define "content"}}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">登录</h4>
        <form method="post" action="/login">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          {{if .LoginError}}<div class="alert alert-danger py-2">用户名或密码错误</div>{{end}}
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" value="{{.UsernameValue}}" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
      </div>
    </div>
  </div>
</div>
{{end}}
