{{define "content"}}
<div class="m-page-head">
  <h3 class="m-mb-0">{{.Title}}</h3>
  <a href="{{.CancelURL}}" class="m-btn m-btn-sm m-btn-outline">返回列表</a>
</div>
{{with index .Errors "detail"}}<div class="m-alert m-alert-danger">{{.}}</div>{{end}}

<form method="post" action="{{.Action}}" class="m-form">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">

  <div class="m-card">
    <div class="m-card-head">基本信息</div>
    <div class="m-card-body">
      <div class="m-field"><label>日期</label><input type="date" class="form-control" name="plan_date" value="{{.Form.PlanDate}}" required></div>
      <div class="m-field"><label>睡眠小时</label><input type="number" step="0.1" min="0" max="24" class="form-control" name="sleep_hours" value="{{if .Form.SleepHours}}{{.Form.SleepHours}}{{end}}"></div>
      <div class="m-field"><label>精力</label>
        <select class="form-select" name="energy_level">
          {{range $.EnergyOptions}}<option value="{{.Code}}" {{if eq $.Form.EnergyLevel .Code}}selected{{end}}>{{.Label}}</option>{{end}}
        </select>
      </div>
      <div class="m-field"><label>今日最重要的成果（MIT）</label><input type="text" class="form-control" name="mit" value="{{.Form.MIT}}"></div>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">执行前后检查（13 项）</div>
    <div class="m-card-body">
      <label class="m-check"><input type="checkbox" name="pre_know_output" {{if .Form.PreKnowOutput}}checked{{end}}><span>启动前：知道本轮交付什么</span></label>
      <label class="m-check"><input type="checkbox" name="pre_materials_ready" {{if .Form.PreMaterialsReady}}checked{{end}}><span>启动前：材料已准备</span></label>
      <label class="m-check"><input type="checkbox" name="pre_phone_handled" {{if .Form.PrePhoneHandled}}checked{{end}}><span>启动前：手机/通知已处理</span></label>
      <label class="m-check"><input type="checkbox" name="during_one_block" {{if .Form.DuringOneBlock}}checked{{end}}><span>执行中：一次只做一个组块</span></label>
      <label class="m-check"><input type="checkbox" name="during_shrink_step" {{if .Form.DuringShrinkStep}}checked{{end}}><span>执行中：卡住先缩小下一步</span></label>
      <label class="m-check"><input type="checkbox" name="during_record_distraction" {{if .Form.DuringRecordDistraction}}checked{{end}}><span>执行中：记录干扰</span></label>
      <label class="m-check"><input type="checkbox" name="post_visible_output" {{if .Form.PostVisibleOutput}}checked{{end}}><span>结束后：有可见产出</span></label>
      <label class="m-check"><input type="checkbox" name="post_recall" {{if .Form.PostRecall}}checked{{end}}><span>结束后：主动回忆/复述</span></label>
      <label class="m-check"><input type="checkbox" name="post_next_step" {{if .Form.PostNextStep}}checked{{end}}><span>结束后：标记下一步</span></label>
      <label class="m-check"><input type="checkbox" name="life_water_food" {{if .Form.LifeWaterFood}}checked{{end}}><span>生活：饮水/正常饮食</span></label>
      <label class="m-check"><input type="checkbox" name="life_walk_exercise" {{if .Form.LifeWalkExercise}}checked{{end}}><span>生活：走路/运动</span></label>
      <label class="m-check"><input type="checkbox" name="life_clean_tidy" {{if .Form.LifeCleanTidy}}checked{{end}}><span>生活：清洁/整理</span></label>
      <label class="m-check"><input type="checkbox" name="life_social_outdoor" {{if .Form.LifeSocialOutdoor}}checked{{end}}><span>生活：真实交流/户外</span></label>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">时间盒组块</div>
    <div class="m-card-body">
      <input type="hidden" name="block_count" id="block_count" value="{{len .Form.Blocks}}">
      <div id="blockRows">
        {{range $i, $b := .Form.Blocks}}
        <div class="m-row-card dyn-row">
          <div class="m-between"><strong>组块 {{$i}}</strong><button type="button" class="m-btn m-btn-sm m-btn-danger" onclick="removeRow(this)">删除本行</button></div>
          <div class="m-field"><label>序号</label><input type="number" class="form-control" name="blocks[{{$i}}].seq" value="{{$b.Seq}}"></div>
          <div class="m-field"><label>组块/任务</label><input type="text" class="form-control" name="blocks[{{$i}}].block_name" value="{{$b.BlockName}}"></div>
          <div class="m-field-row">
            <div class="m-field"><label>开始</label><input type="time" class="form-control" name="blocks[{{$i}}].time_start" value="{{if $b.TimeStart}}{{$b.TimeStart}}{{end}}"></div>
            <div class="m-field"><label>结束</label><input type="time" class="form-control" name="blocks[{{$i}}].time_end" value="{{if $b.TimeEnd}}{{$b.TimeEnd}}{{end}}"></div>
          </div>
          <label class="m-check"><input type="checkbox" name="blocks[{{$i}}].is_done" {{if $b.IsDone}}checked{{end}}><span>完成</span></label>
          <div class="m-field"><label>输入</label><input type="text" class="form-control" name="blocks[{{$i}}].input_desc" value="{{$b.InputDesc}}"></div>
          <div class="m-field"><label>关键动作</label><input type="text" class="form-control" name="blocks[{{$i}}].key_action" value="{{$b.KeyAction}}"></div>
          <div class="m-field"><label>可验收输出</label><input type="text" class="form-control" name="blocks[{{$i}}].deliverable" value="{{$b.Deliverable}}"></div>
        </div>
        {{end}}
      </div>
      <button type="button" class="m-btn m-btn-outline m-btn-block" onclick="addRow()">+ 添加组块</button>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">晚间 5 分钟复盘</div>
    <div class="m-card-body">
      <div class="m-field"><label>今天真正完成了什么</label><textarea class="form-control" rows="2" name="review_accomplished">{{.Form.ReviewAccomplished}}</textarea></div>
      <div class="m-field"><label>今天最大的阻力</label><textarea class="form-control" rows="2" name="review_resistance">{{.Form.ReviewResistance}}</textarea></div>
      <div class="m-field"><label>明天最小的启动动作</label><textarea class="form-control" rows="2" name="review_tomorrow_start">{{.Form.ReviewTomorrowStart}}</textarea></div>
      <div class="m-field"><label>今天值得感谢/享受的事</label><textarea class="form-control" rows="2" name="review_gratitude">{{.Form.ReviewGratitude}}</textarea></div>
    </div>
  </div>

  <div class="m-sticky-submit">
    <a href="{{.CancelURL}}" class="m-btn m-btn-outline">取消</a>
    <button type="submit" class="m-btn m-btn-primary">保存</button>
  </div>
</form>

<template id="rowTpl">
  <div class="m-row-card dyn-row">
    <div class="m-between"><strong>组块 __I__</strong><button type="button" class="m-btn m-btn-sm m-btn-danger" onclick="removeRow(this)">删除本行</button></div>
    <div class="m-field"><label>序号</label><input type="number" class="form-control" name="blocks[__I__].seq" value="__I__"></div>
    <div class="m-field"><label>组块/任务</label><input type="text" class="form-control" name="blocks[__I__].block_name"></div>
    <div class="m-field-row">
      <div class="m-field"><label>开始</label><input type="time" class="form-control" name="blocks[__I__].time_start"></div>
      <div class="m-field"><label>结束</label><input type="time" class="form-control" name="blocks[__I__].time_end"></div>
    </div>
    <label class="m-check"><input type="checkbox" name="blocks[__I__].is_done"><span>完成</span></label>
    <div class="m-field"><label>输入</label><input type="text" class="form-control" name="blocks[__I__].input_desc"></div>
    <div class="m-field"><label>关键动作</label><input type="text" class="form-control" name="blocks[__I__].key_action"></div>
    <div class="m-field"><label>可验收输出</label><input type="text" class="form-control" name="blocks[__I__].deliverable"></div>
  </div>
</template>

<script>
  (function () {
    var box = document.getElementById('blockRows');
    var count = document.getElementById('block_count');
    function sync() { count.value = box.querySelectorAll('.dyn-row').length; }
    window.addRow = function () {
      var html = document.getElementById('rowTpl').innerHTML.replace(/__I__/g, box.querySelectorAll('.dyn-row').length);
      box.insertAdjacentHTML('beforeend', html);
      sync();
    };
    window.removeRow = function (btn) {
      var rows = box.querySelectorAll('.dyn-row');
      if (rows.length > 1) { btn.closest('.dyn-row').remove(); sync(); }
    };
    sync();
  })();
</script>
{{end}}
