{{define "content"}}
<div class="m-page-head">
  <h3 class="m-mb-0">{{.Title}}</h3>
  <a href="{{.CancelURL}}" class="m-btn m-btn-sm m-btn-outline">返回列表</a>
</div>
{{with index .Errors "detail"}}<div class="m-alert m-alert-danger">{{.}}</div>{{end}}

<form method="post" action="{{.Action}}" class="m-form">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">

  <div class="m-card">
    <div class="m-card-head">下周设计：少而明确</div>
    <div class="m-card-body">
      <div class="m-field"><label>周起始日（周一）</label><input type="date" class="form-control" name="week_start" value="{{.Form.WeekStart}}" required></div>
      <div class="m-field"><label>深度时间（要保护）</label><input type="text" class="form-control" name="deep_work_time" value="{{.Form.DeepWorkTime}}"></div>
      <div class="m-field"><label>下周重要成果 1</label><input type="text" class="form-control" name="next_mit_1" value="{{.Form.NextMIT1}}"></div>
      <div class="m-field"><label>下周重要成果 2</label><input type="text" class="form-control" name="next_mit_2" value="{{.Form.NextMIT2}}"></div>
      <div class="m-field"><label>下周重要成果 3</label><input type="text" class="form-control" name="next_mit_3" value="{{.Form.NextMIT3}}"></div>
      <div class="m-field"><label>提前准备的环境/材料</label><textarea class="form-control" rows="2" name="prep_env_materials">{{.Form.PrepEnvMaterials}}</textarea></div>
      <div class="m-field"><label>If-Then：如果……</label><input type="text" class="form-control" name="if_condition" value="{{.Form.IfCondition}}"></div>
      <div class="m-field"><label>那么我就……</label><input type="text" class="form-control" name="then_action" value="{{.Form.ThenAction}}"></div>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">本周领域回顾（4 行）</div>
    <div class="m-card-body">
      {{range $i, $d := .Form.Domains}}
      <div class="m-row-card">
        <input type="hidden" name="domains[{{$d.Domain}}].domain" value="{{$d.Domain}}">
        <strong class="m-domain-label">{{domainLabel $d.Domain}}</strong>
        <div class="m-field"><label>本周事实 / 产出</label><input type="text" class="form-control" name="domains[{{$d.Domain}}].facts" value="{{$d.Facts}}"></div>
        <div class="m-field"><label>状态</label>
          <select class="form-select" name="domains[{{$d.Domain}}].status">
            {{range $.StatusOptions}}<option value="{{.Code}}" {{if eq $d.Status .Code}}selected{{end}}>{{.Label}}</option>{{end}}
          </select>
        </div>
      </div>
      {{end}}
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">任务流清理（GTD + Kanban）</div>
    <div class="m-card-body">
      <input type="hidden" name="flow_count" id="flow_count" value="{{len .Form.Flows}}">
      <div id="flowRows">
        {{range $i, $f := .Form.Flows}}
        <div class="m-row-card dyn-row">
          <div class="m-between"><strong>条目 {{$i}}</strong><button type="button" class="m-btn m-btn-sm m-btn-danger" onclick="removeRow(this)">删除本行</button></div>
          <div class="m-field"><label>序号</label><input type="number" class="form-control" name="flows[{{$i}}].seq" value="{{$f.Seq}}"></div>
          <div class="m-field"><label>分栏</label>
            <select class="form-select" name="flows[{{$i}}].bucket">
              {{range $.BucketOptions}}<option value="{{.Code}}" {{if eq $f.Bucket .Code}}selected{{end}}>{{.Label}}</option>{{end}}
            </select>
          </div>
          <div class="m-field"><label>内容</label><input type="text" class="form-control" name="flows[{{$i}}].content" value="{{$f.Content}}"></div>
        </div>
        {{end}}
      </div>
      <button type="button" class="m-btn m-btn-outline m-btn-block" onclick="addRow()">+ 添加条目</button>
    </div>
  </div>

  <div class="m-card">
    <div class="m-card-head">复盘五问</div>
    <div class="m-card-body">
      <label class="m-check"><input type="checkbox" name="q_skilled_block" {{if .Form.QSkilledBlock}}checked{{end}}><span>哪个组块本周变得更熟练</span></label>
      <label class="m-check"><input type="checkbox" name="q_low_value_time" {{if .Form.QLowValueTime}}checked{{end}}><span>哪件事耗时多但价值很低</span></label>
      <label class="m-check"><input type="checkbox" name="q_estimate_gap" {{if .Form.QEstimateGap}}checked{{end}}><span>哪个时间盒估算偏差最大</span></label>
      <label class="m-check"><input type="checkbox" name="q_rest_connection" {{if .Form.QRestConnection}}checked{{end}}><span>有没有休息、快乐和真实连接</span></label>
      <label class="m-check"><input type="checkbox" name="q_next_adjust" {{if .Form.QNextAdjust}}checked{{end}}><span>下周要继续、调整、停止什么</span></label>
    </div>
  </div>

  <div class="m-sticky-submit">
    <a href="{{.CancelURL}}" class="m-btn m-btn-outline">取消</a>
    <button type="submit" class="m-btn m-btn-primary">保存</button>
  </div>
</form>

<template id="rowTpl">
  <div class="m-row-card dyn-row">
    <div class="m-between"><strong>条目 __I__</strong><button type="button" class="m-btn m-btn-sm m-btn-danger" onclick="removeRow(this)">删除本行</button></div>
    <div class="m-field"><label>序号</label><input type="number" class="form-control" name="flows[__I__].seq" value="__I__"></div>
    <div class="m-field"><label>分栏</label>
      <select class="form-select" name="flows[__I__].bucket">
        {{range .BucketOptions}}<option value="{{.Code}}">{{.Label}}</option>{{end}}
      </select>
    </div>
    <div class="m-field"><label>内容</label><input type="text" class="form-control" name="flows[__I__].content"></div>
  </div>
</template>

<script>
  (function () {
    var box = document.getElementById('flowRows');
    var count = document.getElementById('flow_count');
    function sync() { count.value = box.querySelectorAll('.dyn-row').length; }
    window.addRow = function () {
      var html = document.getElementById('rowTpl').innerHTML.replace(/__I__/g, box.querySelectorAll('.dyn-row').length);
      box.insertAdjacentHTML('beforeend', html);
      sync();
    };
    window.removeRow = function (btn) {
      var rows = box.querySelectorAll('.dyn-row');
      if (rows.length > 1) { btn.closest('.dyn-row').remove(); sync(); }
    };
    sync();
  })();
</script>
{{end}}
