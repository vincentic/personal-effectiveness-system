{{define "base.html"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}} - 个人效能系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body class="m-body">
<header class="m-header">
  <div class="m-header-inner">
    <a class="m-brand" href="/">📋 个人效能</a>
    <span class="m-title">{{.Title}}</span>
    <span class="m-header-links">
      <a href="/view/auto/?next={{.Path}}" class="m-auto">自动</a>
      <a href="/view/pc/?next={{.Path}}" class="m-switch">🖥 PC 版</a>
    </span>
  </div>
</header>

<main class="m-main">
  {{template "content" .}}
</main>

{{if .Authenticated}}
<nav class="m-tabs" aria-label="底部导航">
  <a href="/" class="m-tab {{if eq .Path "/"}}active{{end}}"><span class="m-tab-icon">🏠</span><span>工作台</span></a>
  <a href="/daily/" class="m-tab {{if hasPrefix .Path "/daily"}}active{{end}}"><span class="m-tab-icon">📅</span><span>每日</span></a>
  <a href="/weekly/" class="m-tab {{if hasPrefix .Path "/weekly"}}active{{end}}"><span class="m-tab-icon">🗓️</span><span>每周</span></a>
  <a href="/monthly/" class="m-tab {{if hasPrefix .Path "/monthly"}}active{{end}}"><span class="m-tab-icon">📆</span><span>每月</span></a>
</nav>
{{end}}
</body>
</html>
{{end}}
