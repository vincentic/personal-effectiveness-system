{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">{{.Title}}</h3>
  <a href="{{.CancelURL}}" class="btn btn-outline-secondary btn-sm">返回列表</a>
</div>

{{with index .Errors "detail"}}<div class="alert alert-danger py-2">{{.}}</div>{{end}}

<form method="post" action="{{.Action}}">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">

  <div class="card shadow-sm mb-3">
    <div class="card-header">目标与价值检查</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">月份（YYYY-MM）</label>
          <input type="text" class="form-control" name="month" value="{{.Form.Month}}" placeholder="2026-11" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">是否仍值得投入</label>
          <select class="form-select" name="worth_continue">
            {{range $.WorthOptions}}
            <option value="{{.Code}}" {{if eq $.Form.WorthContinue .Code}}selected{{end}}>{{.Label}}</option>
            {{end}}
          </select>
        </div>
        <div class="col-md-6"><label class="form-label">原因</label><input type="text" class="form-control" name="worth_reason" value="{{.Form.WorthReason}}"></div>
        <div class="col-md-12"><label class="form-label">本月最重要的成果</label><textarea class="form-control" rows="2" name="top_achievement">{{.Form.TopAchievement}}</textarea></div>
        <div class="col-md-6"><label class="form-label">本月最有价值的投入</label><textarea class="form-control" rows="2" name="most_valuable_input">{{.Form.MostValuableInput}}</textarea></div>
        <div class="col-md-6"><label class="form-label">本月最大的机会成本</label><textarea class="form-control" rows="2" name="biggest_opportunity_cost">{{.Form.BiggestOpportunityCost}}</textarea></div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-header">下月只做三项系统改进</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">保留（有效的）</label><textarea class="form-control" rows="2" name="keep_item">{{.Form.KeepItem}}</textarea></div>
        <div class="col-md-4"><label class="form-label">删减（低价值的）</label><textarea class="form-control" rows="2" name="cut_item">{{.Form.CutItem}}</textarea></div>
        <div class="col-md-4"><label class="form-label">实验（新的最小改变）</label><textarea class="form-control" rows="2" name="experiment_item">{{.Form.ExperimentItem}}</textarea></div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-header">系统健康检查（6 项，自评 1-5）</div>
    <div class="card-body">
      {{range $i, $h := .Form.HealthChecks}}
      <div class="row g-2 border rounded p-2 mb-2">
        <input type="hidden" name="checks[{{$h.Module}}].module" value="{{$h.Module}}">
        <div class="col-md-4"><label class="form-label small">模块</label><input type="text" class="form-control form-control-sm" value="{{moduleLabel $h.Module}}" disabled></div>
        <div class="col-md-2"><label class="form-label small">自评</label>
          <select class="form-select form-select-sm" name="checks[{{$h.Module}}].score">
            <option value="">未评</option>
            {{range $score := (list 1 2 3 4 5)}}
            <option value="{{$score}}" {{if scoreSelected $h.Score $score}}selected{{end}}>{{$score}}</option>
            {{end}}
          </select>
        </div>
        <div class="col-md-6"><label class="form-label small">需要的改变</label><input type="text" class="form-control form-control-sm" name="checks[{{$h.Module}}].needed_change" value="{{$h.NeededChange}}"></div>
      </div>
      {{end}}
    </div>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-header">季度方向校准</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="q_skill_portfolio" id="m1" {{if .Form.QSkillPortfolio}}checked{{end}}><label class="form-check-label" for="m1">技能形成可展示作品</label></div></div>
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="q_career_alignment" id="m2" {{if .Form.QCareerAlignment}}checked{{end}}><label class="form-check-label" for="m2">工作更接近长期方向</label></div></div>
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="q_life_autonomy" id="m3" {{if .Form.QLifeAutonomy}}checked{{end}}><label class="form-check-label" for="m3">生活更有自主性</label></div></div>
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="q_recovery_relations" id="m4" {{if .Form.QRecoveryRelations}}checked{{end}}><label class="form-check-label" for="m4">有足够的恢复与关系投入</label></div></div>
        <div class="col-md-6"><div class="form-check"><input class="form-check-input" type="checkbox" name="q_longterm_decision" id="m5" {{if .Form.QLongtermDecision}}checked{{end}}><label class="form-check-label" for="m5">某项长期投资需继续/转向/停止</label></div></div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 mb-4">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{.CancelURL}}" class="btn btn-outline-secondary">取消</a>
  </div>
</form>
{{end}}
