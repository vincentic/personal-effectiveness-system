{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>每周复盘清单</h3>
  <a href="/weekly/new/" class="btn btn-primary">+ 新建周复盘</a>
</div>

<div class="card shadow-sm">
  <table class="table table-hover mb-0 align-middle">
    <thead class="table-light">
      <tr><th>周次</th><th>下周最重要成果</th><th>领域回顾</th><th>任务流</th><th>创建时间</th><th></th></tr>
    </thead>
    <tbody>
      {{range .Reviews}}
      <tr>
        <td><a href="/weekly/{{.ID}}/">{{.WeekStart}} ~ {{.WeekEnd}}</a></td>
        <td>{{if .NextMIT1}}{{.NextMIT1}}{{else}}<span class="text-muted">—</span>{{end}}</td>
        <td><span class="badge bg-secondary">{{len .Domains}} 个领域</span></td>
        <td><span class="badge bg-secondary">{{len .Flows}} 条</span></td>
        <td><small>{{.CreatedAt}}</small></td>
        <td>
          <a href="/weekly/{{.ID}}/edit/" class="btn btn-sm btn-outline-secondary">编辑</a>
          <a href="/weekly/{{.ID}}/delete/" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('确定删除该周复盘吗？')">删除</a>
        </td>
      </tr>
      {{else}}
      <tr><td colspan="6" class="text-center text-muted py-4">暂无周复盘，<a href="/weekly/new/">去创建一份</a></td></tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
