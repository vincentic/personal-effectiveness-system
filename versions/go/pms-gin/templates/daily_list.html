{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>每日执行清单</h3>
  <a href="/daily/new/" class="btn btn-primary">+ 新建日清单</a>
</div>

<div class="card shadow-sm">
  <table class="table table-hover mb-0 align-middle">
    <thead class="table-light">
      <tr><th>日期</th><th>精力</th><th>今日成果（MIT）</th><th>组块进度</th><th>清单完成</th><th></th></tr>
    </thead>
    <tbody>
      {{range .Plans}}
      <tr>
        <td><a href="/daily/{{.ID}}/">{{.PlanDate}}</a></td>
        <td><span class="badge bg-info text-dark">{{energyLabel .EnergyLevel}}</span></td>
        <td>{{if .MIT}}{{.MIT}}{{else}}<span class="text-muted">—</span>{{end}}</td>
        <td style="min-width:140px">
          <div class="progress" style="height:8px">
            <div class="progress-bar bg-success" style="width:{{.BlockProgress}}%"></div>
          </div>
          <small class="text-muted">{{.BlocksDone}}/{{.BlocksTotal}}</small>
        </td>
        <td><small>{{.ChecklistDone}}/{{.ChecklistTotal}}</small></td>
        <td>
          <a href="/daily/{{.ID}}/edit/" class="btn btn-sm btn-outline-secondary">编辑</a>
          <a href="/daily/{{.ID}}/delete/" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('确定删除该日清单及其时间盒吗？')">删除</a>
        </td>
      </tr>
      {{else}}
      <tr><td colspan="6" class="text-center text-muted py-4">暂无日清单，<a href="/daily/new/">去创建一份</a></td></tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
