name: Shared Vue frontend

on:
  push:
    branches: ["release/flask-vue"]
    paths:
      - "versions/vue/pms-vue/**"
      - ".github/workflows/vue-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "versions/vue/pms-vue/**"
      - ".github/workflows/vue-frontend.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/vue/pms-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: versions/vue/pms-vue/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
