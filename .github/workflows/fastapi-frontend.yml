name: FastAPI frontend

on:
  push:
    branches: [main]
    paths:
      - "versions/python/pms-fastapi/frontend/**"
      - ".github/workflows/fastapi-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "versions/python/pms-fastapi/frontend/**"
      - ".github/workflows/fastapi-frontend.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/python/pms-fastapi/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: versions/python/pms-fastapi/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
