<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head(${title} + ' - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h3 class="mb-3" th:text="${title}"></h3>
      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post" th:action="${action}" th:object="${form}">
            <div class="mb-3">
              <label class="form-label">项目名称</label>
              <input type="text" class="form-control" th:field="*{name}" required>
              <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">项目描述</label>
              <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
              <div class="text-danger small" th:errors="*{description}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">状态</label>
              <select class="form-select" th:field="*{status}">
                <option value="active">进行中</option>
                <option value="paused">已暂停</option>
                <option value="done">已完成</option>
              </select>
              <div class="text-danger small" th:errors="*{status}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">开始日期</label>
              <input type="date" class="form-control" th:field="*{startDate}">
              <div class="text-danger small" th:errors="*{startDate}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">结束日期</label>
              <input type="date" class="form-control" th:field="*{endDate}">
              <div class="text-danger small" th:errors="*{endDate}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">项目成员（可多选，Ctrl/⌘ + 点击）</label>
              <select multiple class="form-select" size="6" th:field="*{memberIds}">
                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
              </select>
              <div class="text-danger small" th:errors="*{memberIds}"></div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">保存</button>
              <a th:href="${cancelUrl}" class="btn btn-outline-secondary">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
