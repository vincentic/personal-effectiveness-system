<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('工作台 - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <h3 class="mb-4">工作台</h3>

  <div class="row g-3 mb-4">
    <div class="col-md-3"><div class="card text-bg-primary h-100"><div class="card-body">
      <h6>项目总数</h6><h2 th:text="${projectCount}">0</h2></div></div></div>
    <div class="col-md-3"><div class="card text-bg-secondary h-100"><div class="card-body">
      <h6>任务总数</h6><h2 th:text="${taskCount}">0</h2></div></div></div>
    <div class="col-md-3"><div class="card text-bg-warning h-100"><div class="card-body">
      <h6>待处理 / 进行中</h6><h2 th:text="|${todoCount} / ${doingCount}|">0 / 0</h2></div></div></div>
    <div class="col-md-3"><div class="card text-bg-success h-100"><div class="card-body">
      <h6>已完成</h6><h2 th:text="${doneCount}">0</h2></div></div></div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header">我的项目</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              th:each="p : ${myProjects}">
            <a th:href="@{/projects/{id}/(id=${p.id})}" th:text="${p.name}"></a>
            <span class="badge bg-primary" th:text="${p.statusLabel}"></span>
          </li>
          <li class="list-group-item text-muted" th:if="${#lists.isEmpty(myProjects)}">
            暂无项目，<a th:href="@{/projects/new/}">去创建一个</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header">我的待办任务</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              th:each="t : ${myTasks}">
            <a th:href="@{/projects/{id}/(id=${t.project_id})}" th:text="${t.title}"></a>
            <span>
              <span class="badge me-1" th:classappend="${t.priorityBadge}"
                    th:text="${t.priorityLabel}"></span>
              <span class="badge bg-secondary" th:text="${t.statusLabel}"></span>
            </span>
          </li>
          <li class="list-group-item text-muted" th:if="${#lists.isEmpty(myTasks)}">
            没有待办任务 🎉
          </li>
        </ul>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
