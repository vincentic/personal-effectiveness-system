<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head(${title} + ' - 个人效能系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <h3 class="mb-3" th:text="${title}"></h3>
  <form method="post" th:action="${action}" th:object="${form}">
    <div class="card shadow-sm mb-4">
      <div class="card-header">目标与价值检查</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label">月份（YYYY-MM）</label>
            <input type="text" class="form-control" th:field="*{month}" placeholder="2026-11" required>
            <div class="text-danger small" th:errors="*{month}"></div></div>
          <div class="col-md-5"><label class="form-label">本月最重要的成果</label><textarea class="form-control" rows="2" th:field="*{topAchievement}"></textarea></div>
          <div class="col-md-4"><label class="form-label">是否仍值得投入</label>
            <select class="form-select" th:field="*{worthContinue}">
              <option value="yes">是</option><option value="adjust">调整</option><option value="stop">停止</option>
            </select>
            <div class="text-danger small" th:errors="*{worthContinue}"></div></div>
          <div class="col-md-8"><label class="form-label">原因</label><input type="text" class="form-control" th:field="*{worthReason}"></div>
          <div class="col-md-6"><label class="form-label">本月最有价值的投入</label><textarea class="form-control" rows="2" th:field="*{mostValuableInput}"></textarea></div>
          <div class="col-md-6"><label class="form-label">本月最大的机会成本</label><textarea class="form-control" rows="2" th:field="*{biggestOpportunityCost}"></textarea></div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">下月只做三项系统改进</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">保留（有效的）</label><textarea class="form-control" rows="2" th:field="*{keepItem}"></textarea></div>
          <div class="col-md-4"><label class="form-label">删减（低价值的）</label><textarea class="form-control" rows="2" th:field="*{cutItem}"></textarea></div>
          <div class="col-md-4"><label class="form-label">实验（新的最小改变）</label><textarea class="form-control" rows="2" th:field="*{experimentItem}"></textarea></div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">系统健康检查（6 模块，自评 1–5，留空表示未评）</div>
      <div class="card-body">
        <div class="row g-2 align-items-end" th:each="i : ${#numbers.sequence(0, 5)}">
          <div class="col-md-3">
            <label class="form-label">模块</label>
            <input type="hidden" th:field="*{healthChecks[__${i}__].module}">
            <select class="form-select" th:id="|moduleSel${i}|" disabled>
              <option value="direction">方向清晰度</option>
              <option value="taskload">任务负荷</option>
              <option value="blockquality">组块质量</option>
              <option value="timebox">时间盒现实度</option>
              <option value="sleepenergy">睡眠 / 体能 / 情绪</option>
              <option value="reviewquality">复盘质量</option>
            </select>
          </div>
          <div class="col-md-2"><label class="form-label">评分</label>
            <input type="number" min="1" max="5" class="form-control" th:field="*{healthChecks[__${i}__].score}"></div>
          <div class="col-md-7"><label class="form-label">需要的改变</label>
            <input type="text" class="form-control" th:field="*{healthChecks[__${i}__].neededChange}"></div>
        </div>
        <div class="text-danger small" th:errors="*{healthChecks}"></div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header">季度方向校准（可选）</div>
      <div class="card-body">
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qSkillPortfolio}" id="m1"><label class="form-check-label" for="m1">技能是否形成可展示作品？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qCareerAlignment}" id="m2"><label class="form-check-label" for="m2">工作是否更接近长期方向？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qLifeAutonomy}" id="m3"><label class="form-check-label" for="m3">生活是否更有自主性？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qRecoveryRelations}" id="m4"><label class="form-check-label" for="m4">是否有足够的恢复与关系投入？</label></div>
        <div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{qLongtermDecision}" id="m5"><label class="form-check-label" for="m5">是否应该继续、转向或停止某项长期投资？</label></div>
      </div>
    </div>

    <div class="d-flex gap-2 mb-4">
      <button type="submit" class="btn btn-primary">保存</button>
      <a th:href="${cancelUrl}" class="btn btn-outline-secondary">取消</a>
    </div>
  </form>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
