<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('项目列表 - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>项目列表</h3>
    <a th:href="@{/projects/new/}" class="btn btn-primary">+ 新建项目</a>
  </div>

  <form class="row g-2 mb-3" method="get" action="/projects/">
    <div class="col-md-4">
      <input type="text" name="q" th:value="${keyword}" class="form-control" placeholder="按名称搜索...">
    </div>
    <div class="col-md-3">
      <select name="status" class="form-select">
        <option value="" th:selected="${status == ''}">全部状态</option>
        <option value="active" th:selected="${status == 'active'}">进行中</option>
        <option value="paused" th:selected="${status == 'paused'}">已暂停</option>
        <option value="done" th:selected="${status == 'done'}">已完成</option>
      </select>
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-primary w-100">筛选</button>
    </div>
  </form>

  <div class="card shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>项目名称</th><th>负责人</th><th>状态</th><th>进度</th><th>创建时间</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${projects}">
          <td><a th:href="@{/projects/{id}/(id=${p.id})}" th:text="${p.name}"></a></td>
          <td th:text="${p.ownerName}"></td>
          <td><span class="badge" th:classappend="${p.statusBadge}"
                    th:text="${p.statusLabel}"></span></td>
          <td style="min-width:140px">
            <div class="progress" style="height:8px">
              <div class="progress-bar bg-success" th:style="'width:' + ${p.progress} + '%'"></div>
            </div>
            <small class="text-muted" th:text="|${p.doneTaskCount}/${p.taskCount}|"></small>
          </td>
          <td><small th:text="${p.createdDate}"></small></td>
          <td>
            <span th:if="${p.owner_id == currentUserId}">
              <a th:href="@{/projects/{id}/edit/(id=${p.id})}"
                 class="btn btn-sm btn-outline-secondary">编辑</a>
              <a th:href="@{/projects/{id}/delete/(id=${p.id})}"
                 class="btn btn-sm btn-outline-danger"
                 onclick="return confirm('确定删除该项目及其所有任务吗？')">删除</a>
            </span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(projects)}">
          <td colspan="6" class="text-center text-muted py-4">暂无项目</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
