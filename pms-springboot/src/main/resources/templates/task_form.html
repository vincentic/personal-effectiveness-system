<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head(${title} + ' - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h3 class="mb-3">
        <span th:text="${title}"></span>
        <span class="text-muted fs-6">· 项目：<span th:text="${projectName}"></span></span>
      </h3>
      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post" th:action="${action}" th:object="${form}">
            <div class="mb-3">
              <label class="form-label">任务标题</label>
              <input type="text" class="form-control" th:field="*{title}" required>
              <div class="text-danger small" th:errors="*{title}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">任务描述</label>
              <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
              <div class="text-danger small" th:errors="*{description}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">执行人</label>
              <select class="form-select" th:field="*{assigneeId}">
                <option value="">未指派</option>
                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
              </select>
              <div class="text-danger small" th:errors="*{assigneeId}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">状态</label>
              <select class="form-select" th:field="*{status}">
                <option value="todo">待处理</option>
                <option value="doing">进行中</option>
                <option value="done">已完成</option>
              </select>
              <div class="text-danger small" th:errors="*{status}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">优先级</label>
              <select class="form-select" th:field="*{priority}">
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high">高</option>
              </select>
              <div class="text-danger small" th:errors="*{priority}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">截止日期</label>
              <input type="date" class="form-control" th:field="*{dueDate}">
              <div class="text-danger small" th:errors="*{dueDate}"></div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">保存</button>
              <a th:href="${cancelUrl}" class="btn btn-outline-secondary">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
