<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head(${project.name} + ' - 项目管理系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="mb-1" th:text="${project.name}"></h3>
      <span class="badge me-2" th:classappend="${project.statusBadge}"
            th:text="${project.statusLabel}"></span>
      <span class="text-muted small">
        负责人：<span th:text="${project.ownerName}"></span> ·
        成员：<span th:text="${project.memberNames == '' ? '无' : project.memberNames}"></span>
      </span>
    </div>
    <div class="d-flex gap-2">
      <a th:href="@{/projects/{id}/tasks/new/(id=${project.id})}" class="btn btn-primary">+ 新建任务</a>
      <a th:if="${isOwner}" th:href="@{/projects/{id}/edit/(id=${project.id})}"
         class="btn btn-outline-secondary">编辑项目</a>
    </div>
  </div>

  <div class="card shadow-sm mb-4" th:if="${project.description != null and project.description != ''}">
    <div class="card-body" th:utext="${project.descriptionHtml}"></div>
  </div>

  <div class="row g-3">
    <div class="col-md-4 board-column board-todo">
      <h6>待处理</h6>
      <th:block th:replace="~{fragments :: taskCards(${todoTasks})}"></th:block>
    </div>
    <div class="col-md-4 board-column board-doing">
      <h6>进行中</h6>
      <th:block th:replace="~{fragments :: taskCards(${doingTasks})}"></th:block>
    </div>
    <div class="col-md-4 board-column board-done">
      <h6>已完成</h6>
      <th:block th:replace="~{fragments :: taskCards(${doneTasks})}"></th:block>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
