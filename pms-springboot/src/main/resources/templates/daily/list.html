<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('每日清单 - 个人效能系统')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">每日执行清单</h3>
    <a th:href="@{/daily/new/}" class="btn btn-primary">+ 填写今日清单</a>
  </div>
  <p class="text-muted">一人一天一条：组块执行 + 执行前后检查 + 生活维护 + 晚间复盘。</p>

  <div class="card shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>日期</th><th>精力</th><th>今日 MIT</th><th>组块</th><th>清单</th><th style="width:170px"></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${plans}">
          <td><a th:href="@{/daily/{id}/edit/(id=${p.id})}" th:text="${p.planDate}"></a></td>
          <td><span class="badge bg-secondary" th:text="${p.energyLevel}"></span></td>
          <td><span th:text="${#strings.abbreviate(p.mit, 40)}"></span></td>
          <td style="min-width:150px">
            <div class="progress" style="height:8px">
              <div class="progress-bar bg-success" th:style="'width:' + ${p.blockProgress} + '%'"></div>
            </div>
            <small class="text-muted" th:text="|${p.blocksDone}/${p.blocksTotal}|"></small>
          </td>
          <td><small class="text-muted" th:text="|${p.checklistDone}/13|"></small></td>
          <td>
            <a th:href="@{/daily/{id}/edit/(id=${p.id})}" class="btn btn-sm btn-outline-secondary">编辑</a>
            <form method="post" th:action="@{/daily/{id}/delete/(id=${p.id})}" class="d-inline"
                  onsubmit="return confirm('确定删除该清单及其时间盒吗？')">
              <button class="btn btn-sm btn-outline-danger">删除</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(plans)}">
          <td colspan="6" class="text-center text-muted py-4">暂无每日清单，<a th:href="@{/daily/new/}">去填写</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
