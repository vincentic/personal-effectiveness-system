<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">个人效能系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">📋 个人效能系统</a>
    <div class="navbar-nav me-auto" th:if="${authenticated}">
      <a class="nav-link" th:href="@{/}">工作台</a>
      <a class="nav-link" th:href="@{/daily/}">每日清单</a>
      <a class="nav-link" th:href="@{/weekly/}">每周复盘</a>
      <a class="nav-link" th:href="@{/monthly/}">每月重构</a>
      <a class="nav-link" th:if="${isAdmin}" th:href="@{/admin/users/}">用户管理</a>
    </div>
    <div class="navbar-nav" th:if="${authenticated}">
      <span class="navbar-text me-3">👤 <span th:text="${username}"></span></span>
      <form method="post" th:action="@{/logout}" class="d-inline">
        <button class="btn btn-outline-light btn-sm">退出</button>
      </form>
    </div>
  </div>
</nav>

<div th:fragment="footer">
  <footer class="text-center text-muted py-4 mt-5">
    <small>个人效能系统 · Spring Boot + MySQL</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
