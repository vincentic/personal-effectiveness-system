<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">项目管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">📋 项目管理系统</a>
    <div class="navbar-nav me-auto" th:if="${authenticated}">
      <a class="nav-link" th:href="@{/}">工作台</a>
      <a class="nav-link" th:href="@{/projects/}">项目列表</a>
      <a class="nav-link" th:href="@{/projects/new/}">新建项目</a>
      <a class="nav-link" th:if="${isAdmin}" th:href="@{/admin/users/}">用户管理</a>
    </div>
    <div class="navbar-nav" th:if="${authenticated}">
      <span class="navbar-text me-3">👤 <span th:text="${username}"></span></span>
      <form method="post" th:action="@{/logout}" class="d-inline">
        <button class="btn btn-outline-light btn-sm">退出</button>
      </form>
    </div>
  </div>
</nav>

<div th:fragment="footer">
  <footer class="text-center text-muted py-4 mt-5">
    <small>项目管理系统 · Spring Boot + MySQL</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

<!-- 任务卡片列表；对应 Django 版 _task_cards.html -->
<div th:fragment="taskCards(list)">
  <div class="card shadow-sm mb-2" th:each="t : ${list}">
    <div class="card-body py-2 px-3">
      <div class="d-flex justify-content-between align-items-start">
        <strong class="small" th:text="${t.title}"></strong>
        <span class="badge" th:classappend="${t.priorityBadge}" th:text="${t.priorityLabel}"></span>
      </div>
      <p class="small text-muted mb-1" th:if="${t.descriptionShort != ''}"
         th:text="${t.descriptionShort}"></p>
      <div class="d-flex justify-content-between align-items-center">
        <small class="text-muted">
          <span th:text="${t.assigneeName == '' ? '未指派' : t.assigneeName}"></span>
          <span th:if="${t.dueDate != ''}" th:text="' · 截止 ' + ${t.dueDate}"></span>
        </small>
        <span class="d-flex gap-1">
          <a class="btn btn-sm btn-outline-secondary py-0 px-1"
             th:href="@{/tasks/{id}/edit/(id=${t.id})}">改</a>
          <a class="btn btn-sm btn-outline-danger py-0 px-1"
             th:href="@{/tasks/{id}/delete/(id=${t.id})}"
             onclick="return confirm('确定删除该任务吗？')">删</a>
        </span>
      </div>
    </div>
  </div>
  <p class="text-muted small" th:if="${#lists.isEmpty(list)}">暂无任务</p>
</div>
</body>
</html>
